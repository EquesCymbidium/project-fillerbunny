services:
  - type: web
    name: fillerbunny-generator
    runtime: python
    plan: free
    buildCommand: pip install -r Web/requirements.txt
    startCommand: uvicorn Web.backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WEB_CONCURRENCY
        value: 1
      - key: CORS_ORIGINS
        value: "*"
